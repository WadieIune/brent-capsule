<svg width="100%" viewBox="0 0 680 515" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Sistema productivo con el backtest como capa de validación paralela</title>
<desc>El dato crudo pasa por el Gate 1 de calidad de dato (control geométrico, no la CNN; corrige una infradotación de capital del 13,4%). El dato limpio alimenta dos ramas de modelos: la CNN (Gate 2 de detección de canal, AUC 0,97) que produce episodios para el XGB-AFT de supervivencia (C-index 0,664), y en paralelo el VaR condicional a volatilidad (FHS-EWMA, −22,7% de capital). A la derecha, en paralelo, el backtest (walk-forward purgado, DSR, PBO/CSCV, nulo de paseo aleatorio, Kupiec/Christoffersen, semáforo de Basilea) valida cada uno de esos modelos. Ambas ramas convergen en el Risk Director.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker>
</defs>

<rect x="280" y="40" width="120" height="36" rx="8" fill="#eceff1" stroke="#90a4ae"/>
<text x="340" y="63" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#37474f">Dato crudo</text>
<line x1="340" y1="76" x2="340" y2="94" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="196" y="96" width="236" height="46" rx="8" fill="#eceff1" stroke="#90a4ae"/>
<text x="314" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#263238">Gate 1 · Calidad de dato</text>
<text x="314" y="133" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#546e7a">control geométrico — no la CNN</text>
<line x1="432" y1="119" x2="450" y2="119" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="452" y="96" width="180" height="46" rx="8" fill="#e3f0e6" stroke="#6ba378"/>
<text x="542" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2f5c3a">+13,4% capital</text>
<text x="542" y="133" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4a7d57">por dato (exactitud)</text>
<line x1="314" y1="142" x2="314" y2="160" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="196" y="162" width="236" height="30" rx="8" fill="#eceff1" stroke="#90a4ae"/>
<text x="314" y="181" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#37474f">Dato limpio → alimenta todo</text>
<line x1="272" y1="192" x2="152" y2="220" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="345" y1="192" x2="335" y2="220" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="60" y="222" width="180" height="48" rx="8" fill="#e4eef7" stroke="#6b9bd1"/>
<text x="150" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a4971">Gate 2 · Detección canal</text>
<text x="150" y="259" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a6a9a">CNN · AUC 0,97 (gate)</text>

<rect x="250" y="222" width="170" height="48" rx="8" fill="#eceff1" stroke="#90a4ae"/>
<text x="335" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#263238">VaR FHS-EWMA</text>
<text x="335" y="259" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#546e7a">condicional a volatilidad</text>
<line x1="335" y1="270" x2="335" y2="282" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="250" y="284" width="170" height="40" rx="8" fill="#e3f0e6" stroke="#6ba378"/>
<text x="335" y="303" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2f5c3a">−22,7% capital</text>
<text x="335" y="319" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4a7d57">por modelo (eficiencia)</text>

<line x1="150" y1="270" x2="150" y2="290" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="80" y="292" width="140" height="28" rx="8" fill="#eceff1" stroke="#90a4ae"/>
<text x="150" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#37474f">Episodios de canal</text>
<line x1="150" y1="320" x2="150" y2="340" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="60" y="342" width="180" height="48" rx="8" fill="#e4eef7" stroke="#6b9bd1"/>
<text x="150" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a4971">XGB-AFT supervivencia</text>
<text x="150" y="379" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a6a9a">C-index 0,664 · vida canal</text>

<line x1="434" y1="222" x2="434" y2="390" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 4"/>
<line x1="434" y1="246" x2="427" y2="246" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 4"/>
<line x1="434" y1="366" x2="427" y2="366" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 4"/>
<line x1="434" y1="306" x2="448" y2="306" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="450" y="231" width="190" height="152" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="545" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#37474f">Backtest</text>
<text x="545" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#546e7a">valida cada modelo</text>
<text x="462" y="294" text-anchor="start" font-family="sans-serif" font-size="12" fill="#546e7a">· walk-forward purgado</text>
<text x="462" y="312" text-anchor="start" font-family="sans-serif" font-size="12" fill="#546e7a">· DSR · PBO / CSCV</text>
<text x="462" y="330" text-anchor="start" font-family="sans-serif" font-size="12" fill="#546e7a">· nulo paseo aleatorio</text>
<text x="462" y="348" text-anchor="start" font-family="sans-serif" font-size="12" fill="#546e7a">· Kupiec · Christoffersen</text>
<text x="462" y="366" text-anchor="start" font-family="sans-serif" font-size="12" fill="#546e7a">· semáforo de Basilea</text>

<line x1="150" y1="390" x2="230" y2="430" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="335" y1="324" x2="320" y2="430" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="150" y="430" width="280" height="50" rx="8" fill="#eceff1" stroke="#90a4ae"/>
<text x="290" y="451" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#263238">Risk Director</text>
<text x="290" y="468" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#546e7a">capital correcto + eficiente + régimen</text>

<rect x="150" y="492" width="11" height="11" rx="2" fill="#6b9bd1"/>
<text x="166" y="501" text-anchor="start" font-family="sans-serif" font-size="12" fill="#546e7a">IA / ML</text>
<rect x="240" y="492" width="11" height="11" rx="2" fill="#7bbf8e"/>
<text x="256" y="501" text-anchor="start" font-family="sans-serif" font-size="12" fill="#546e7a">efecto en capital</text>
<rect x="392" y="492" width="11" height="11" rx="2" fill="none" stroke="#8a8a8a" stroke-dasharray="3 3"/>
<text x="408" y="501" text-anchor="start" font-family="sans-serif" font-size="12" fill="#546e7a">validación (backtest)</text>
</svg>
