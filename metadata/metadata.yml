metadata_version: 1
name: "Data Quality en series financieras — gate de dos capas con controles por representación, CNN 1D y XGBoost"
description: >
  Framework de control de calidad de dato para series temporales financieras,
  evaluado con defectos sintéticos de verdad conocida. Los umbrales se calibran
  en validación con un objetivo nominal común; la FPR OOS se reporta y puede
  diferir. El gate tiene dos capas: Gate A reúne los controles
  deterministas y estadísticos clásicos (3σ, checks TRIM de repetidos, rangos,
  calendario); Gate B mira el mismo dato en cuatro REPRESENTACIONES distintas
  —precio crudo, retorno frente a pares, canal/geometría y vintage frente al
  snapshot almacenado— e incorpora la capa de IA: una CNN 1D supervisada y
  XGBoost como combinador de señales. Los umbrales empíricos se congelan antes
  del test; no se reclama garantía conformal ni control bajo drift. El análisis
  de colas es descriptivo y usa estandarización ex post.

  Evidencia exploratoria: varios controles cubren familias sintéticas distintas,
  pero la FPR realizada difiere y los mejores controles por familia se eligen
  sobre el mismo test. No se demuestra superioridad generalizable de CNN ni
  XGBoost; hace falta evaluación externa y etiquetas de incidentes reales. La
  cápsula conserva además el sistema anterior de patrones
  chartistas (CNN EfficientNet sobre GASF/GADF, CV purgada, DSR/PBO).

  Todos los resultados son provisionales y están sujetos a auditoría cruzada;
  las cifras de impacto en capital se retiraron explícitamente por no ser
  defendibles con una cartera de juguete.
